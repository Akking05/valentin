<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>С 8 Марта! 🌷</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --p: #ff85a1;
            /* Нежно-розовый */
            --p-dark: #fb6f92;
            --bg: #fff5f8;
            --glass: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe3ec 100%);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
        }

        /* ЭТАПЫ */
        .section {
            display: none;
            height: 100vh;
            width: 100%;
            padding: 25px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: absolute;
            inset: 0;
        }

        .active {
            display: flex;
            animation: fadeInStage 0.8s ease forwards;
        }

        @keyframes fadeInStage {
            from {
                opacity: 0;
                transform: scale(1.05);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 40px 20px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(251, 111, 146, 0.2);
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: var(--p-dark);
            margin-bottom: 15px;
        }

        .special-text {
            font-family: 'Caveat';
            font-size: 2.2rem;
            color: #ff4d6d;
            margin-top: 10px;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        #yes-btn {
            background: var(--p-dark);
            color: white;
        }

        #no-btn {
            background: #ced4da;
            color: white;
            position: relative;
        }

        /* ПОЛАРОИД */
        .photo-wrap {
            width: 75vw;
            max-width: 280px;
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            transform: rotate(2deg);
            border-radius: 3px;
        }

        .photo-wrap img {
            width: 100%;
            height: 70vw;
            object-fit: cover;
        }

        #type-area {
            font-family: 'Caveat';
            font-size: 1.8rem;
            margin: 20px 0;
            min-height: 2.5em;
            color: #555;
        }
    </style>
</head>

<body>

    <audio id="music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <section id="s1" class="section active">
        <div class="card">
            <h1>Моя маленькая капризуля ❤️</h1>
            <p style="font-size: 0.9rem; margin-bottom: 20px;">У меня есть для тебя важный вопрос...</p>
            <div
                style="height: 180px; display: flex; align-items: center; justify-content: center; position: relative; width: 100%;">
                <button id="yes-btn" class="btn" onclick="nextStage(2)">Примешь поздравление? ✨</button>
                <button id="no-btn" class="btn">Нет</button>
            </div>
        </div>
    </section>

    <section id="s2" class="section">
        <div class="photo-wrap">
            <img src="my-photo.jpg" id="current-img">
            <p style="font-family:'Caveat'; font-size:1.5rem; margin-top:10px; color:#444;" id="img-desc">Для самой
                прекрасной</p>
        </div>
        <div id="type-area"></div>
        <button class="btn" style="background:var(--p-dark); color:white; margin-top: 20px;"
            onclick="changeSlide()">Дальше 🌷</button>
    </section>

    <section id="s3" class="section">
        <div id="box" style="font-size: 100px; cursor: pointer;">🎁</div>
        <div id="final-msg" style="display:none; width: 100%;" class="card">
            <h1>С 8 Марта, любимая! 🌸</h1>
            <p>Пусть твоя улыбка сияет ярче солнца.</p>
            <button class="btn" style="background:#25D366; color:white; margin-top:20px;"
                onclick="sendResponse()">Написать мне ❤️</button>
        </div>
    </section>

    <script>
        const MY_PHONE = "7775423613";
        const slides = [
            { img: "my-photo.jpg", desc: "Я всегда рядом", txt: "В этот весенний день..." },
            { img: "her-photo.jpg", desc: "Моя капризуля ❤️", txt: "Я хочу пожелать тебе счастья..." },
            { img: "our-photo.jpg", desc: "Мы — одно целое", txt: "Люблю тебя бесконечно! 🌷" }
        ];

        let currentSlide = 0;
        const no = document.getElementById('no-btn');
        const yes = document.getElementById('yes-btn');
        const music = document.getElementById('music');

        // Убегающая кнопка
        const escape = (e) => {
            e.preventDefault();
            no.style.position = 'fixed';
            no.style.left = Math.random() * 70 + 'vw';
            no.style.top = Math.random() * 70 + 'vh';
            yes.style.transform = `scale(${1 + (currentSlide + 1) * 0.2})`;
        };
        no.addEventListener('touchstart', escape);
        no.addEventListener('click', escape);

        function nextStage(n) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('s' + n).classList.add('active');
            if (n === 2) {
                music.play().catch(() => { });
                updateSlide();
            }
        }

        function updateSlide() {
            const slide = slides[currentSlide];
            document.getElementById('current-img').src = slide.img;
            document.getElementById('img-desc').innerText = slide.desc;
            runType(slide.txt);
        }

        function changeSlide() {
            currentSlide++;
            if (currentSlide < slides.length) {
                updateSlide();
            } else {
                nextStage(3);
            }
        }

        async function runType(text) {
            const area = document.getElementById('type-area');
            area.innerText = "";
            for (let c of text) { area.innerText += c; await new Promise(r => setTimeout(r, 60)); }
        }

        let clicks = 0;
        document.getElementById('box').onclick = function () {
            clicks++;
            this.style.transform = `scale(${1 + clicks * 0.15}) rotate(${clicks * 5}deg)`;
            if (clicks > 3) {
                this.style.display = 'none';
                document.getElementById('final-msg').style.display = 'block';
                confetti({ particleCount: 150, spread: 70, colors: ['#ff85a1', '#fbb6ce', '#ffffff'] });
            }
        };

        function sendResponse() {
            const url = `https://wa.me/${MY_PHONE}?text=${encodeURIComponent("Спасибо за поздравление, мой любимый! ❤️")}`;
            window.open(url, '_blank');
        }
    </script>
</body>

</html>
